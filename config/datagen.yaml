# Imitation-data corpus design: python -m autocross data-manifest --profile smoke|full
# Scenario definitions are a pure function of this file, the profile and the generator version.
family: brake_turn_obstacle
seed: 20261017              # root of every per-scenario seed (in-cell jitter); change it for a new draw
max_attempts: 8             # in-cell redraws when a draw violates a constraint (all attempts are recorded)

profiles:
  smoke:                    # tooling check: every bin of every factor at least once (3 cells x 8 runs)
    strength: 1
    replicates: 1
  full:                     # every pair of bins of every two factors (pairwise covering design)
    strength: 2
    replicates: 2
  large:                    # training cohort: the pairwise design with 8 independent in-cell draws per row
    strength: 2
    replicates: 8
# parameter (including in-cell jitter and nuisance values) is copied from the base.
contrast_factors: [turn_radius_m, turn_direction, preview_m, approach_speed_mps, obstacle_side,
                   obstacle_clearance_m, road_width_m]

# Splits hold out parameter regions (cells of region_factors), not random seeds. A scenario's split
# is its region's split; contrasts that would leave their base's split are skipped and reported.
split:
  region_factors: [turn_radius_m, preview_m]
  regions:                  # regions not listed are train
    val:  [{turn_radius_m: open, preview_m: nominal}]
    test: [{turn_radius_m: medium, preview_m: short}]

# Overrides of config/sim.yaml for every data-generation run (recorded in the corpus index).
generation:
  sim: {max_time_s: 90}
  compute_budget: {mode: enforce}   # event rule: 50 ms deadline, 1 core; an overrun holds the previous command
  output: {plot: false}
  carla: {render: false, spectator: none, draw_path: false}
