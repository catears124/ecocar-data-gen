[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "veridrive"
version = "0.1.0"
description = "Machine-verified Bellman-optimal drive planning with certified imitation data and Lean proofs."
readme = "README.md"
license = {text = "No license specified"}
authors = [{name = "catears124", email = "jparkerpatton@gmail.com"}]
keywords = ["EcoCAR", "autocross", "CARLA", "path planning", "autonomous driving", "simulation", "imitation learning", "Lean"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "psutil>=5.9", "matplotlib>=3.7", "pygame>=2.5"]

[project.urls]
Homepage = "https://github.com/catears124/ecocar-data-gen"
Repository = "https://github.com/catears124/ecocar-data-gen"
Issues = "https://github.com/catears124/ecocar-data-gen/issues"

[project.optional-dependencies]
carla = ["carla==0.9.16"]
dev = ["pytest>=7"]

[project.scripts]
autocross = "autocross.cli:main"

[tool.setuptools.packages.find]
include = ["autocross*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
